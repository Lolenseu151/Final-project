<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Paper Trail Panic (HTML5)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0c10;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #f6f7fb;
        }
        #papertrail-canvas {
            width: 100%;
            height: 100%;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 600;
            color: #54c2ff;
        }
    </style>
    <script type="text/javascript" src="finalproject/finalproject.nocache.js" defer></script>
</head>
<body>
    <div id="papertrail-canvas">
        <div class="loading">Preparing audit cover-up…</div>
    </div>
</body>
</html>
