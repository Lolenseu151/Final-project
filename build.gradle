plugins {
    id 'java'
    id 'application'
}

group = 'com.mygdx.game'
version = '1.0'

ext {
    gdxVersion = '1.12.0'
}

repositories {
    mavenCentral()
    maven { url 'https://oss.sonatype.org/content/groups/public/' }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
}

application {
    // Default to the standard launcher so the game flows through Loading -> Main Menu -> Level Select.
    mainClass = 'com.mygdx.game.desktop.DesktopLauncher'
}

// Set working directory for the run task to find assets
tasks.named('run') {
    workingDir = project.rootDir
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
