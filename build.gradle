plugins {
    id 'java'
    id 'application'
    id 'edu.sc.seis.launch4j' version '3.0.1'
}

group = 'com.mygdx.game'
version = '1.0'

ext {
    gdxVersion = '1.12.0'
}

repositories {
    mavenCentral()
    maven { url 'https://oss.sonatype.org/content/groups/public/' }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
}

application {
    // Default to the standard launcher so the game flows through Loading -> Main Menu -> Level Select.
    mainClass = 'com.mygdx.game.desktop.DesktopLauncher'
    applicationName = 'Final-project'
}

// Set working directory for the run task to find assets
tasks.named('run') {
    workingDir = project.rootDir
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass.get() }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('prepareExeResources', Copy) {
    dependsOn(tasks.named('jar'))
    from('assets')
    into(layout.buildDirectory.dir('launch4j/assets').get().asFile)
}

launch4j {
    outfile = 'Final-project.exe'
    mainClassName = application.mainClass.get()
    jarTask = tasks.named('jar')
    chdir = '%EXEDIR%'
    jreMinVersion = '17'
    icon = 'build/icons/papertrail.ico'
}

tasks.named('createExe') {
    dependsOn('prepareExeResources')
}

tasks.register('launch4j') {
    dependsOn(tasks.named('createExe'))
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
